name: CI/CD Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Authenticate to Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.TAILSCALE_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Dev Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.TAILSCALE_SERVER_IP }} << 'EOF'
            source /home/aicounting/venv/bin/activate
            cd /home/aicounting/aicounting-backend
            git pull origin main
            pip install -r requirements.txt

            cd /home/aicounting/aicounting-backend/aicounting
            python3 manage.py migrate --noinput
            python3 manage.py collectstatic --noinput

            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart doc-api
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart celery

          EOF
