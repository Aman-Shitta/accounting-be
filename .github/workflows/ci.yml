name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aicounting
          POSTGRES_USER: aicounting
          POSTGRES_PASSWORD: aicounting
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      POSTGRES_DB: aicounting
      POSTGRES_USER: aicounting
      POSTGRES_PASSWORD: aicounting
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django checks
        run: python manage.py check

      - name: No migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Every module imports
        # Catches an undeclared dependency, which has bitten this repo three
        # times — anthropic, datalab-python-sdk and pypdf were all imported at
        # module scope while missing from requirements.
        run: |
          python - <<'PY'
          import os, django, importlib, pathlib, sys
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "aicounting.settings")
          django.setup()
          failed = []
          for f in sorted(pathlib.Path(".").rglob("*.py")):
              if any(p in f.parts for p in (".venv", "__pycache__", "migrations")):
                  continue
              mod = str(f.with_suffix("")).replace("/", ".").removesuffix(".__init__")
              if mod in ("manage", "conftest", "gunicorn.conf") or mod.startswith("v1.tests"):
                  continue
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  failed.append(f"{mod}: {type(e).__name__}: {e}")
          print("\n".join(failed) if failed else "every module imports cleanly")
          sys.exit(1 if failed else 0)
          PY

      - name: Tests
        run: pytest
