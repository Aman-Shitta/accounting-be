name: CI/CD Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Jump Host to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.JUMP_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via jump host to target
        run: |
          ssh -o ProxyJump=${{ secrets.DEPLOY_USER }}@${{ secrets.JUMP_HOST }} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.TARGET_HOST }} << 'EOF'

            cd ${{ secrets.PROJECT_PATH }}

            # Use token-authenticated pull
            git config --global credential.helper ""
            git pull https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_DEPLOY_TOKEN }}@github.com/<your-org-or-username>/<repo-name>.git main

            source ../venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            sudo systemctl restart doc-api
            sudo systemctl restart celery

          EOF
